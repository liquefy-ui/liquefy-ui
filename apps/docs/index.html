<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/brand/liquefy-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/liquefy-icon.svg" />
    <meta
      name="description"
      content="liquefy-ui — transparent Liquid Glass components for React, with WebGL optics, spring physics, a shadcn registry and an MCP server."
    />
    <title>liquefy-ui — Liquid Glass for React</title>

    <!--
      The link preview, which is how most people meet this project: a card in a
      post, a chat, or a pull request comment. Without it they get the bare URL,
      and a library whose whole argument is what it looks like arrives looking
      like nothing.

      Every URL here is absolute on purpose. A relative `og:image` is not
      resolved by the crawlers that read these — it is simply dropped.

      `brand/liquefy-og.png` is a real screenshot of the landing page's lens,
      redrawn by `scripts/record-card.mjs`; the declared size has to keep
      matching the file, and `test/metadata.test.mjs` reads the PNG header to
      check that it does.
    -->
    <link rel="canonical" href="https://liquefy-ui.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="liquefy-ui" />
    <meta property="og:url" content="https://liquefy-ui.com/" />
    <meta property="og:title" content="liquefy-ui — Liquid Glass for React" />
    <meta
      property="og:description"
      content="Real WebGL edge refraction, springs that read pointer velocity, and accessible React primitives. A shadcn registry and an MCP server come with it. MIT."
    />
    <meta property="og:image" content="https://liquefy-ui.com/brand/liquefy-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A glass lens resting on the liquefy ui wordmark, bending the letters and the grid behind it at its bezel."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://liquefy-ui.com/brand/liquefy-og.png" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('liquefy-docs-theme')
        document.documentElement.dataset.theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
