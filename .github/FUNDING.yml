# What puts the Sponsor button on the repository page. GitHub reads this file from
# the default branch only, so it has to reach main to have any effect.
#
# The button appears for entries that resolve. A `github:` name that is not
# enrolled in GitHub Sponsors resolves to nothing and is skipped silently, so this
# file was committed before the account existed and started working on its own the
# day enrolment went through.
#
# If the payout account ever has to be replaced, the trap is the bank rather than
# GitHub: Stripe Connect rejects Japan Post, Rakuten, PayPay and au Jibun outright.
# Megabanks and Sony / SBI Sumishin work, and dollars arrive, so a bank that takes
# foreign currency cheaply is worth more here than a familiar one.
#
# Sponsoring the person rather than the organisation is deliberate. An org listing
# needs its own bank account and its own review, and there is one maintainer here;
# it can move later without breaking anyone's existing sponsorship.
github: [yu5ag]
# Other platforms need no GitHub review and can be added alongside, each one an
# account someone has to create first:
# ko_fi: yu5ag
# buy_me_a_coffee: yu5ag
# open_collective: liquefy-ui
# custom: ['https://liquefy-ui.com/#/sponsor']
