name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # The registry trusts this workflow by name rather than a token: pnpm exchanges
  # this OIDC token for a short-lived one, and npm attaches the provenance
  # attestation itself. Renaming this file breaks publishing until the trusted
  # publisher is updated on all four packages.
  id-token: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # `changeset publish` reads the tags to know what is already out.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Versions are decided on rc, by the Version workflow. A changeset that
      # reaches main un-applied means rc was merged before its version pull
      # request was — so the numbers about to be published are the previous
      # release's. Stop here and say so, rather than publishing them again under
      # the same version and letting `changeset publish` shrug it off as a no-op.
      - name: Refuse to publish with changesets still pending
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | sort)
          if [ -n "$pending" ]; then
            {
              echo '### Release stopped'
              echo
              echo 'These changesets have not been applied to a version yet:'
              echo
              echo '```'
              echo "$pending"
              echo '```'
              echo
              echo 'Merge the **chore: version packages** pull request into `rc` first,'
              echo 'then merge `rc` into `main` again.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::rc was merged before its version pull request; nothing published."
            exit 1
          fi

      # A release is the moment a red test matters most, so main is verified here
      # rather than trusting whichever CI run happened to precede it.
      - run: pnpm check

      # No NODE_AUTH_TOKEN on purpose. `changeset publish` shells out to
      # `pnpm publish` in a pnpm workspace, and pnpm has no --provenance flag at
      # all — it silently ignores publishConfig.provenance, which is how 0.1.0
      # went out unsigned. Trusted publishing is what signs these: pnpm trades the
      # OIDC token above for a short-lived credential and the registry attaches the
      # attestation. A token in the environment would let an OIDC failure fall back
      # to an unsigned publish instead of failing loudly.
      #
      # The guard above means there is never a changeset left for this to version,
      # so it only ever publishes and pushes the tags.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
