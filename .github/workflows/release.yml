name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # The registry trusts this workflow by name rather than a token: pnpm exchanges
  # this OIDC token for a short-lived one, and npm attaches the provenance
  # attestation itself. Renaming this file breaks publishing until the trusted
  # publisher is updated on all four packages.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch to decide what to bump.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A release is the moment a red test matters most, so main is verified here
      # rather than trusting whichever CI run happened to precede it.
      - run: pnpm check

      # No NODE_AUTH_TOKEN on purpose. `changeset publish` shells out to
      # `pnpm publish` in a pnpm workspace, and pnpm has no --provenance flag at
      # all — it silently ignores publishConfig.provenance, which is how 0.1.0
      # went out unsigned. Trusted publishing is what signs these: pnpm trades the
      # OIDC token above for a short-lived credential and the registry attaches the
      # attestation. A token in the environment would let an OIDC failure fall back
      # to an unsigned publish instead of failing loudly.
      - uses: changesets/action@v1
        with:
          # Opens or updates the "Version Packages" PR; publishes once it merges.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
